# Deploys docs/ to GitHub Pages. Not active until this repo is pushed to GitHub
# and Pages is set to "GitHub Actions" (Settings > Pages > Source).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build
        env:
          # Project pages live under /<repo>; a custom domain or user site uses "".
          # Override with repo variables PATH_PREFIX / SITE_URL / FORM_ID if needed.
          PATH_PREFIX: ${{ vars.PATH_PREFIX != '' && vars.PATH_PREFIX || steps.pages.outputs.base_path }}
          # Hidden preview: no SITE_URL, so no canonical / absolute og URLs are emitted.
          SITE_URL: ${{ vars.SITE_URL }}
          FORM_ID: ${{ vars.FORM_ID }}
        run: python build.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
