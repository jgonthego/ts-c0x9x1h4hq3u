# Deploys docs/ to GitHub Pages. Not active until this repo is pushed to GitHub
# and Pages is set to "GitHub Actions" (Settings > Pages > Source).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          # Project pages live under /<repo>; a custom domain or user site uses "".
          # Override with repo variables PATH_PREFIX / SITE_URL / FORM_ID if needed.
          PATH_PREFIX: ${{ vars.PATH_PREFIX != '' && vars.PATH_PREFIX || steps.pages.outputs.base_path }}
          # Hidden preview: no SITE_URL, so no canonical / absolute og URLs are emitted.
          SITE_URL: ${{ vars.SITE_URL }}
          FORM_ID: ${{ vars.FORM_ID }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
